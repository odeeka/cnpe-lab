# Service Accounts for BookStore Application

# Frontend Service Account
apiVersion: v1
kind: ServiceAccount
metadata:
  name: frontend-sa
  namespace: bookstore-prod
  labels:
    app: frontend
automountServiceAccountToken: false
---
# API Gateway Service Account
apiVersion: v1
kind: ServiceAccount
metadata:
  name: api-gateway-sa
  namespace: bookstore-prod
  labels:
    app: api-gateway
automountServiceAccountToken: false
---
# Catalog Service Account
apiVersion: v1
kind: ServiceAccount
metadata:
  name: catalog-service-sa
  namespace: bookstore-prod
  labels:
    app: catalog-service
automountServiceAccountToken: false
---
# Order Service Account
apiVersion: v1
kind: ServiceAccount
metadata:
  name: order-service-sa
  namespace: bookstore-prod
  labels:
    app: order-service
automountServiceAccountToken: false
---
# User Service Account
apiVersion: v1
kind: ServiceAccount
metadata:
  name: user-service-sa
  namespace: bookstore-prod
  labels:
    app: user-service
automountServiceAccountToken: false
---
# Payment Service Account
apiVersion: v1
kind: ServiceAccount
metadata:
  name: payment-service-sa
  namespace: bookstore-prod
  labels:
    app: payment-service
automountServiceAccountToken: false
---
# Database Service Account (needs more privileges for StatefulSet)
apiVersion: v1
kind: ServiceAccount
metadata:
  name: postgres-sa
  namespace: bookstore-prod
  labels:
    app: postgres
automountServiceAccountToken: true
---
# Redis Service Account
apiVersion: v1
kind: ServiceAccount
metadata:
  name: redis-sa
  namespace: bookstore-prod
  labels:
    app: redis
automountServiceAccountToken: false
---
# ArgoCD Application Controller Service Account
apiVersion: v1
kind: ServiceAccount
metadata:
  name: argocd-application-sa
  namespace: bookstore-prod
  labels:
    app.kubernetes.io/part-of: argocd
automountServiceAccountToken: true

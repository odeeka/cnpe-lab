# Sealed Secrets Configuration
# Use kubeseal to encrypt secrets before committing to Git

# Install Sealed Secrets Controller
# helm repo add sealed-secrets https://bitnami-labs.github.io/sealed-secrets
# helm install sealed-secrets sealed-secrets/sealed-secrets -n kube-system

# Example: Sealing a secret
# kubectl create secret generic db-credentials \
#   --from-literal=username=bookstore_user \
#   --from-literal=password=super-secret-password \
#   --dry-run=client -o yaml | \
#   kubeseal --format yaml > sealed-db-credentials.yaml

---
# SealedSecret for PostgreSQL credentials
# Note: This is an EXAMPLE - actual sealed secrets will have different encrypted values
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: postgres-credentials
  namespace: bookstore-prod
spec:
  encryptedData:
    # These values should be encrypted using kubeseal
    # Example encryption command:
    # echo -n "bookstore_user" | kubeseal --raw --scope namespace-wide
    username: AgBxxxxxxxxxxxxEncryptedValuexxxxxxxxxxxxxx
    password: AgBxxxxxxxxxxxxEncryptedValuexxxxxxxxxxxxxx
  template:
    metadata:
      name: postgres-credentials
      namespace: bookstore-prod
    type: Opaque
---
# SealedSecret for JWT secret
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: jwt-secret
  namespace: bookstore-prod
spec:
  encryptedData:
    secret: AgBxxxxxxxxxxxxEncryptedValuexxxxxxxxxxxxxx
  template:
    metadata:
      name: jwt-secret
      namespace: bookstore-prod
    type: Opaque
---
# SealedSecret for Payment API credentials
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: payment-secrets
  namespace: bookstore-prod
spec:
  encryptedData:
    api-key: AgBxxxxxxxxxxxxEncryptedValuexxxxxxxxxxxxxx
  template:
    metadata:
      name: payment-secrets
      namespace: bookstore-prod
    type: Opaque
---
# External Secrets Operator Configuration (Alternative to Sealed Secrets)
# This integrates with external secret stores like AWS Secrets Manager, HashiCorp Vault, etc.
apiVersion: external-secrets.io/v1beta1
kind: SecretStore
metadata:
  name: vault-backend
  namespace: bookstore-prod
spec:
  provider:
    vault:
      server: "https://vault.example.com:8200"
      path: "secret"
      version: "v2"
      auth:
        kubernetes:
          mountPath: "kubernetes"
          role: "bookstore-role"
---
# External Secret pulling from Vault
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: db-credentials
  namespace: bookstore-prod
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: SecretStore
    name: vault-backend
  target:
    name: db-credentials
    creationPolicy: Owner
  data:
    - secretKey: username
      remoteRef:
        key: bookstore/database
        property: username
    - secretKey: password
      remoteRef:
        key: bookstore/database
        property: password

# Alerting Rules for BookStore Application
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: bookstore-alerts
  namespace: observability
  labels:
    release: prometheus
spec:
  groups:
    - name: bookstore.availability
      rules:
        - alert: ServiceDown
          expr: up{job=~".*bookstore.*"} == 0
          for: 1m
          labels:
            severity: critical
          annotations:
            summary: "Service {{ $labels.job }} is down"
            description: "{{ $labels.job }} has been down for more than 1 minute."
        
        - alert: HighPodRestarts
          expr: increase(kube_pod_container_status_restarts_total{namespace=~"bookstore.*"}[1h]) > 3
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "Pod {{ $labels.pod }} is restarting frequently"
            description: "Pod {{ $labels.pod }} has restarted {{ $value }} times in the last hour."
        
        - alert: PodCrashLooping
          expr: rate(kube_pod_container_status_restarts_total{namespace=~"bookstore.*"}[15m]) * 60 * 15 > 3
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "Pod {{ $labels.pod }} is crash looping"
            description: "Pod {{ $labels.pod }} is crash looping."

    - name: bookstore.performance
      rules:
        - alert: HighResponseTime
          expr: histogram_quantile(0.95, sum(rate(http_request_duration_seconds_bucket{namespace=~"bookstore.*"}[5m])) by (le, service)) > 2
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "High response time for {{ $labels.service }}"
            description: "95th percentile response time is {{ $value }}s for {{ $labels.service }}."
        
        - alert: HighErrorRate
          expr: sum(rate(http_requests_total{status=~"5..",namespace=~"bookstore.*"}[5m])) / sum(rate(http_requests_total{namespace=~"bookstore.*"}[5m])) > 0.05
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "High error rate in BookStore"
            description: "Error rate is {{ $value | humanizePercentage }} in the last 5 minutes."
        
        - alert: HighRequestRate
          expr: sum(rate(http_requests_total{namespace=~"bookstore.*"}[1m])) > 1000
          for: 5m
          labels:
            severity: info
          annotations:
            summary: "High request rate"
            description: "Request rate is {{ $value }} req/s."

    - name: bookstore.resources
      rules:
        - alert: HighMemoryUsage
          expr: container_memory_working_set_bytes{namespace=~"bookstore.*"} / container_spec_memory_limit_bytes{namespace=~"bookstore.*"} > 0.85
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "High memory usage for {{ $labels.pod }}"
            description: "{{ $labels.pod }} is using {{ $value | humanizePercentage }} of its memory limit."
        
        - alert: HighCPUUsage
          expr: rate(container_cpu_usage_seconds_total{namespace=~"bookstore.*"}[5m]) / container_spec_cpu_quota{namespace=~"bookstore.*"} * 100000 > 0.85
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "High CPU usage for {{ $labels.pod }}"
            description: "{{ $labels.pod }} is using {{ $value | humanizePercentage }} of its CPU limit."
        
        - alert: PersistentVolumeAlmostFull
          expr: kubelet_volume_stats_available_bytes{namespace=~"bookstore.*"} / kubelet_volume_stats_capacity_bytes{namespace=~"bookstore.*"} < 0.15
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "PV {{ $labels.persistentvolumeclaim }} is almost full"
            description: "PV has only {{ $value | humanizePercentage }} free space."

    - name: bookstore.database
      rules:
        - alert: PostgresDown
          expr: pg_up{namespace=~"bookstore.*"} == 0
          for: 1m
          labels:
            severity: critical
          annotations:
            summary: "PostgreSQL is down"
            description: "PostgreSQL database is not responding."
        
        - alert: PostgresHighConnections
          expr: pg_stat_activity_count{namespace=~"bookstore.*"} / pg_settings_max_connections{namespace=~"bookstore.*"} > 0.8
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "PostgreSQL connection pool almost exhausted"
            description: "{{ $value | humanizePercentage }} of PostgreSQL connections are in use."
        
        - alert: RedisDown
          expr: redis_up{namespace=~"bookstore.*"} == 0
          for: 1m
          labels:
            severity: critical
          annotations:
            summary: "Redis is down"
            description: "Redis cache is not responding."
        
        - alert: RedisHighMemory
          expr: redis_memory_used_bytes{namespace=~"bookstore.*"} / redis_memory_max_bytes{namespace=~"bookstore.*"} > 0.85
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "Redis memory usage high"
            description: "Redis is using {{ $value | humanizePercentage }} of max memory."

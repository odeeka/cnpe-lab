# ServiceMonitors for BookStore Application
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: frontend-monitor
  namespace: observability
  labels:
    app: frontend
    release: prometheus
spec:
  selector:
    matchLabels:
      app: frontend
  namespaceSelector:
    matchNames:
      - bookstore-prod
      - bookstore-staging
      - bookstore-dev
  endpoints:
    - port: http
      path: /metrics
      interval: 30s
---

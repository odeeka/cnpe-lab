# Phase 1: Foundation - Namespace Configuration
# Creates all required namespaces with labels and resource quotas

---
# Production namespace for BookStore application
apiVersion: v1
kind: Namespace
metadata:
  name: bookstore-prod
  labels:
    environment: production
    team: bookstore
    cost-center: engineering
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: bookstore-prod-quota
  namespace: bookstore-prod
spec:
  hard:
    requests.cpu: "8"
    requests.memory: 16Gi
    limits.cpu: "16"
    limits.memory: 32Gi
    pods: "50"
    persistentvolumeclaims: "10"
    services: "20"
---
apiVersion: v1
kind: LimitRange
metadata:
  name: bookstore-prod-limits
  namespace: bookstore-prod
spec:
  limits:
    - default:
        cpu: 500m
        memory: 512Mi
      defaultRequest:
        cpu: 100m
        memory: 128Mi
      max:
        cpu: 2
        memory: 4Gi
      min:
        cpu: 50m
        memory: 64Mi
      type: Container

---
# Staging namespace for BookStore application
apiVersion: v1
kind: Namespace
metadata:
  name: bookstore-staging
  labels:
    environment: staging
    team: bookstore
    cost-center: engineering
    pod-security.kubernetes.io/enforce: baseline
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: bookstore-staging-quota
  namespace: bookstore-staging
spec:
  hard:
    requests.cpu: "4"
    requests.memory: 8Gi
    limits.cpu: "8"
    limits.memory: 16Gi
    pods: "30"
    persistentvolumeclaims: "5"
---
apiVersion: v1
kind: LimitRange
metadata:
  name: bookstore-staging-limits
  namespace: bookstore-staging
spec:
  limits:
    - default:
        cpu: 200m
        memory: 256Mi
      defaultRequest:
        cpu: 50m
        memory: 64Mi
      max:
        cpu: 1
        memory: 2Gi
      min:
        cpu: 25m
        memory: 32Mi
      type: Container

---
# Platform namespace for ArgoCD and platform services
apiVersion: v1
kind: Namespace
metadata:
  name: platform
  labels:
    environment: platform
    team: platform-engineering
    cost-center: platform
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: platform-quota
  namespace: platform
spec:
  hard:
    requests.cpu: "4"
    requests.memory: 8Gi
    limits.cpu: "8"
    limits.memory: 16Gi
    pods: "30"

---
# Monitoring namespace for observability stack
apiVersion: v1
kind: Namespace
metadata:
  name: monitoring
  labels:
    environment: platform
    team: platform-engineering
    cost-center: platform
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: monitoring-quota
  namespace: monitoring
spec:
  hard:
    requests.cpu: "4"
    requests.memory: 8Gi
    limits.cpu: "8"
    limits.memory: 16Gi
    pods: "50"

---
# Backup namespace for Velero
apiVersion: v1
kind: Namespace
metadata:
  name: backup
  labels:
    environment: platform
    team: platform-engineering
    cost-center: platform
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: backup-quota
  namespace: backup
spec:
  hard:
    requests.cpu: "2"
    requests.memory: 4Gi
    limits.cpu: "4"
    limits.memory: 8Gi
    pods: "10"

---
# Ingress namespace
apiVersion: v1
kind: Namespace
metadata:
  name: ingress-nginx
  labels:
    environment: platform
    app.kubernetes.io/name: ingress-nginx

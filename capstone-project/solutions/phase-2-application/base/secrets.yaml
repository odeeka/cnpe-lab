# Secrets for BookStore Application
apiVersion: v1
kind: Secret
metadata:
  name: postgres-credentials
type: Opaque
stringData:
  username: bookstore_user
  password: changeme-in-production
---
apiVersion: v1
kind: Secret
metadata:
  name: db-credentials
type: Opaque
stringData:
  catalog-service-url: postgresql://bookstore_user:changeme-in-production@postgres-client:5432/catalog_db
  order-service-url: postgresql://bookstore_user:changeme-in-production@postgres-client:5432/order_db
  user-service-url: postgresql://bookstore_user:changeme-in-production@postgres-client:5432/user_db
  payment-service-url: postgresql://bookstore_user:changeme-in-production@postgres-client:5432/payment_db
---
apiVersion: v1
kind: Secret
metadata:
  name: jwt-secret
type: Opaque
stringData:
  secret: your-jwt-secret-key-change-in-production
---
apiVersion: v1
kind: Secret
metadata:
  name: payment-secrets
type: Opaque
stringData:
  api-key: your-payment-api-key-change-in-production
